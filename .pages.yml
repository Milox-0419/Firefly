media:
  input: src/content/posts/images
  output: ./images

collections:
  - name: "posts"
    label: "文章"
    type: "collection"           # 这行是关键，之前漏掉了
    folder: "src/content/posts"  # 用 folder 而不是 path
    fields:
      - { name: "title", label: "标题", widget: "string" }
      - { name: "date", label: "日期", widget: "datetime" }
      - { name: "description", label: "描述", widget: "text" }
      - { name: "tags", label: "标签", widget: "list" }
      - { name: "body", label: "正文", widget: "markdown" }